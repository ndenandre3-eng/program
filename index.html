<!DOCTYPE html>
<html>
<head>
    <title>Pemrograman Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <h1>PEMROGRAMAN WEB</h1>
    </div>

    <!-- PARAGRAF -->
    <p class="paragraf">
        Ini adalah contoh paragraf untuk latihan CSS. 
        Kita mencoba berbagai properti text dan font agar tampilan lebih menarik.
    </p>

    <!-- TABEL -->
    <h2 class="judul-tabel">Tabel Data</h2>

    <table class="tabel">
        <tr>
            <td>Nama</td>
            <td>Umur</td>
        </tr>
        <tr>
            <td>Andre</td>
            <td>20</td>
        </tr>
        <tr>
            <td>Budi</td>
            <td>21</td>
        </tr>
    </table>

    <!-- BOX RAINBOW -->
    <div class="box"></div>

    <p class="info">Arahkan mouse ke kotak!</p>

    <!-- FOOTER -->
    <div class="footer">
        <p>© 2025 Pemrograman Web</p>
    </div>

</body>
</html>
